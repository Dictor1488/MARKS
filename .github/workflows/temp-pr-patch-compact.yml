name: Temporary compact PR patch helper

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/lighten-compact-secondary-text'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply compact secondary text colors
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('as3/src_flash/src/com/inq/marks/InqMarksBattleRendererBase.as')
          text = path.read_text(encoding='utf-8')

          start = text.index('        private function _drawCompact():void')
          end = text.index('        // ── NEER', start)
          section = text[start:end]

          total_pattern = re.compile(
              r'            _total\.htmlText = _fmt\(_fmtNum\(current\) \+ " / " \+\n'
              r'\s+\(target > 0 \? _fmtNum\(target\) : "N/A"\), 12, COMPACT_DIM_WHITE\);'
          )
          new_total = '''            _total.htmlText = _fmt(_fmtNum(current), 12, COLOR_LABEL) +
                              _fmt(" / " + (target > 0 ? _fmtNum(target) : "N/A"), 12, 0xE2E8EE);'''
          section, _ = total_pattern.subn(new_total, section, count=1)

          old_label = '            _targetLabel.htmlText = _fmt(_strSumLabel(), 12, COMPACT_DIM_WHITE);'
          new_label = '            _targetLabel.htmlText = _fmt(_strSumLabel(), 12, 0xE2E8EE);'
          section = section.replace(old_label, new_label, 1)

          old_milestone = '                var milestoneColor:uint = uint(MILESTONE_COLORS[milestoneIdx]);'
          new_milestone = '''                var milestoneColor:uint = milestoneIdx == 0 ? 0xB8C4CC :
                                              (milestoneIdx == 1 ? 0xE0E0E0 : 0xE6D8A0);'''
          section = section.replace(old_milestone, new_milestone, 1)

          updated = text[:start] + section + text[end:]
          path.write_text(updated, encoding='utf-8')

      - name: Commit focused update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temp-lighten-compact.yml 2>/dev/null || true
          git rm -f .github/compact-patch-trigger.txt 2>/dev/null || true
          git add as3/src_flash/src/com/inq/marks/InqMarksBattleRendererBase.as
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Lighten compact secondary text"
          git push origin HEAD:${{ github.head_ref }}
