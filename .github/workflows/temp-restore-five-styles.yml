name: Temporary restore all five Marks styles

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/restore-all-five-styles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore five style options
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'python/gui/mods/mod_00_inq_marks_config.py': (
                  "_VALID_STYLES = ('compact', 'polaroid', 'neer', 'minimal')",
                  "_VALID_STYLES = ('classic', 'compact', 'polaroid', 'neer', 'minimal')",
                  "_DEFAULT_STYLE = 'compact'",
                  "_DEFAULT_STYLE = 'classic'",
                  "_STYLE_HINT = 'compact | polaroid | neer | minimal'",
                  "_STYLE_HINT = 'classic | compact | polaroid | neer | minimal'",
              ),
              'python/gui/mods/mod_inq_marks.py': (
                  "_VALID_BATTLE_STYLES = ('compact', 'polaroid', 'neer', 'minimal')",
                  "_VALID_BATTLE_STYLES = ('classic', 'compact', 'polaroid', 'neer', 'minimal')",
                  "_GARAGE_STYLES = ('compact', 'polaroid')",
                  "_GARAGE_STYLES = ('classic', 'compact', 'polaroid')",
                  "_DEFAULT_BATTLE_STYLE = 'compact'",
                  "_DEFAULT_BATTLE_STYLE = 'classic'",
                  "_CONFIG_STYLE_HINT = 'compact | polaroid | neer | minimal'",
                  "_CONFIG_STYLE_HINT = 'classic | compact | polaroid | neer | minimal'",
              ),
              'python/gui/mods/mod_inq_marks_rules.py': (
                  "_VALID_STYLES = ('compact', 'polaroid', 'neer', 'minimal')",
                  "_VALID_STYLES = ('classic', 'compact', 'polaroid', 'neer', 'minimal')",
                  "_GARAGE_STYLES = ('compact', 'polaroid')",
                  "_GARAGE_STYLES = ('classic', 'compact', 'polaroid')",
                  "_DEFAULT_STYLE = 'compact'",
                  "_DEFAULT_STYLE = 'classic'",
                  "_STYLE_HINT = 'compact | polaroid | neer | minimal'",
                  "_STYLE_HINT = 'classic | compact | polaroid | neer | minimal'",
              ),
          }

          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              for index in range(0, len(pairs), 2):
                  old = pairs[index]
                  new = pairs[index + 1]
                  if old not in text:
                      raise RuntimeError('%s: expected text not found: %s' % (file_name, old))
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

      - name: Validate style list
        shell: python
        run: |
          from pathlib import Path

          expected = "('classic', 'compact', 'polaroid', 'neer', 'minimal')"
          hint = "classic | compact | polaroid | neer | minimal"
          early = Path('python/gui/mods/mod_00_inq_marks_config.py').read_text(encoding='utf-8')
          main = Path('python/gui/mods/mod_inq_marks.py').read_text(encoding='utf-8')
          rules = Path('python/gui/mods/mod_inq_marks_rules.py').read_text(encoding='utf-8')

          assert expected in early
          assert expected in main
          assert expected in rules
          assert hint in early
          assert hint in main
          assert hint in rules
          assert "_GARAGE_STYLES = ('classic', 'compact', 'polaroid')" in main
          assert "_GARAGE_STYLES = ('classic', 'compact', 'polaroid')" in rules
          assert "_DEFAULT_STYLE = 'classic'" in early
          assert "_DEFAULT_BATTLE_STYLE = 'classic'" in main
          assert "_DEFAULT_STYLE = 'classic'" in rules

      - name: Remove helper and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temp-restore-five-styles.yml
          git add python/gui/mods/mod_00_inq_marks_config.py
          git add python/gui/mods/mod_inq_marks.py
          git add python/gui/mods/mod_inq_marks_rules.py
          git commit -m "Restore all five Marks styles"
          git push origin HEAD:${{ github.head_ref }}
