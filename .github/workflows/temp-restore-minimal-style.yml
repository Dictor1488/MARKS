name: Temporary restore minimal style

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/restore-minimal-style'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Replace neer with minimal in public style list
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('python/gui/mods/mod_00_inq_marks_config.py'),
              Path('python/gui/mods/mod_inq_marks.py'),
              Path('python/gui/mods/mod_inq_marks_rules.py'),
          ]
          old_tuple = "('classic', 'compact', 'polaroid', 'neer')"
          new_tuple = "('classic', 'compact', 'polaroid', 'minimal')"
          old_hint = 'classic | compact | polaroid | neer'
          new_hint = 'classic | compact | polaroid | minimal'

          for path in files:
              text = path.read_text(encoding='utf-8')
              if old_tuple not in text:
                  raise RuntimeError('style tuple not found in %s' % path)
              if old_hint not in text:
                  raise RuntimeError('style hint not found in %s' % path)
              text = text.replace(old_tuple, new_tuple)
              text = text.replace(old_hint, new_hint)
              path.write_text(text, encoding='utf-8')

      - name: Validate four styles and automatic garage behavior
        shell: python
        run: |
          from pathlib import Path
          for path in (
              Path('python/gui/mods/mod_00_inq_marks_config.py'),
              Path('python/gui/mods/mod_inq_marks.py'),
              Path('python/gui/mods/mod_inq_marks_rules.py'),
          ):
              text = path.read_text(encoding='utf-8')
              assert "('classic', 'compact', 'polaroid', 'minimal')" in text
              assert 'classic | compact | polaroid | minimal' in text
              assert "('classic', 'compact', 'polaroid', 'neer')" not in text
          main = Path('python/gui/mods/mod_inq_marks.py').read_text(encoding='utf-8')
          assert "_GARAGE_STYLES = ('classic', 'compact', 'polaroid')" in main
          assert "self._garageBadgeEnabled = style in _GARAGE_STYLES" in main

      - name: Remove helper and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temp-restore-minimal-style.yml
          git add python/gui/mods/mod_00_inq_marks_config.py
          git add python/gui/mods/mod_inq_marks.py
          git add python/gui/mods/mod_inq_marks_rules.py
          git commit -m "Restore minimal Marks style"
          git push origin HEAD:${{ github.head_ref }}
