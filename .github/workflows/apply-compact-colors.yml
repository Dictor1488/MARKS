name: Apply compact colors

on:
  push:
    branches:
      - agent/brighten-compact-colors
    paths:
      - .github/workflows/apply-compact-colors.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/brighten-compact-colors
          fetch-depth: 0

      - name: Patch compact colors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("as3/src_flash/src/com/inq/marks/InqMarksBattleRendererBase.as")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "_delta.htmlText = _fmt(deltaStr, 13, kind > 0 ? COLOR_GREEN : COLOR_RED);",
                  "_delta.htmlText = _fmt(deltaStr, 13, kind > 0 ? HTML_GREEN : HTML_RED);",
              ),
              (
                  "var fillCol:uint = kind >= 0 ? 0x9BD64B : 0xC51917;",
                  "var fillCol:uint = kind >= 0 ? HTML_GREEN : HTML_BAR_RED;",
              ),
              (
                  "var col:uint = _style == 2\n                ? (kind > 0 ? HTML_GREEN : HTML_ARROW_RED)\n                : (kind > 0 ? ARROW_UP : ARROW_DOWN);",
                  "var col:uint = (_style == STYLE_POLAROID || _style == STYLE_COMPACT)\n                ? (kind > 0 ? HTML_GREEN : HTML_ARROW_RED)\n                : (kind > 0 ? ARROW_UP : ARROW_DOWN);",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-compact-colors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add as3/src_flash/src/com/inq/marks/InqMarksBattleRendererBase.as .github/workflows/apply-compact-colors.yml
          git commit -m "Brighten compact status colors"
          git push origin HEAD:agent/brighten-compact-colors
