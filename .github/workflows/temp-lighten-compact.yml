name: Temporary compact text color update

on:
  push:
    branches:
      - agent/lighten-compact-secondary-text

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Lighten compact secondary text'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lighten-compact-secondary-text
          fetch-depth: 0

      - name: Apply focused compact color changes
        shell: python
        run: |
          from pathlib import Path

          path = Path('as3/src_flash/src/com/inq/marks/InqMarksBattleRendererBase.as')
          text = path.read_text(encoding='utf-8')

          start = text.index('        private function _drawCompact():void')
          end = text.index('        // ── NEER', start)
          section = text[start:end]

          old_total = '''            _total.htmlText = _fmt(_fmtNum(current) + " / " +
                              (target > 0 ? _fmtNum(target) : "N/A"), 12, COMPACT_DIM_WHITE);'''
          new_total = '''            _total.htmlText = _fmt(_fmtNum(current), 12, COLOR_LABEL) +
                              _fmt(" / " + (target > 0 ? _fmtNum(target) : "N/A"), 12, 0xE2E8EE);'''
          assert old_total in section, 'compact total text block not found'
          section = section.replace(old_total, new_total, 1)

          old_label = '            _targetLabel.htmlText = _fmt(_strSumLabel(), 12, COMPACT_DIM_WHITE);'
          new_label = '            _targetLabel.htmlText = _fmt(_strSumLabel(), 12, 0xE2E8EE);'
          assert old_label in section, 'compact total label not found'
          section = section.replace(old_label, new_label, 1)

          old_milestone = '                var milestoneColor:uint = uint(MILESTONE_COLORS[milestoneIdx]);'
          new_milestone = '''                var milestoneColor:uint = milestoneIdx == 0 ? 0xB8C4CC :
                                              (milestoneIdx == 1 ? 0xE0E0E0 : 0xE6D8A0);'''
          assert old_milestone in section, 'compact milestone color not found'
          section = section.replace(old_milestone, new_milestone, 1)

          updated = text[:start] + section + text[end:]
          assert updated != text
          path.write_text(updated, encoding='utf-8')

      - name: Commit update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-lighten-compact.yml
          git add as3/src_flash/src/com/inq/marks/InqMarksBattleRendererBase.as
          git commit -m "Lighten compact secondary text"
          git push origin HEAD:agent/lighten-compact-secondary-text
