name: Temporary restore neer and remove classic

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/restore-neer-remove-classic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Update public style list
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('python/gui/mods/mod_00_inq_marks_config.py'),
              Path('python/gui/mods/mod_inq_marks.py'),
              Path('python/gui/mods/mod_inq_marks_rules.py'),
          ]

          replacements = {
              "('classic', 'compact', 'polaroid', 'minimal')": "('compact', 'polaroid', 'neer', 'minimal')",
              "'classic | compact | polaroid | minimal'": "'compact | polaroid | neer | minimal'",
              "_DEFAULT_STYLE = 'classic'": "_DEFAULT_STYLE = 'compact'",
              "_DEFAULT_BATTLE_STYLE = 'classic'": "_DEFAULT_BATTLE_STYLE = 'compact'",
              "_GARAGE_STYLES = ('classic', 'compact', 'polaroid')": "_GARAGE_STYLES = ('compact', 'polaroid')",
          }

          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text == original:
                  raise RuntimeError('No replacements made in %s' % path)
              path.write_text(text, encoding='utf-8')

      - name: Validate styles
        shell: python
        run: |
          from pathlib import Path
          for path in [
              Path('python/gui/mods/mod_00_inq_marks_config.py'),
              Path('python/gui/mods/mod_inq_marks.py'),
              Path('python/gui/mods/mod_inq_marks_rules.py'),
          ]:
              text = path.read_text(encoding='utf-8')
              assert "('compact', 'polaroid', 'neer', 'minimal')" in text
              assert "'compact | polaroid | neer | minimal'" in text
              assert "('classic', 'compact', 'polaroid', 'minimal')" not in text
          main = Path('python/gui/mods/mod_inq_marks.py').read_text(encoding='utf-8')
          rules = Path('python/gui/mods/mod_inq_marks_rules.py').read_text(encoding='utf-8')
          assert "_GARAGE_STYLES = ('compact', 'polaroid')" in main
          assert "_GARAGE_STYLES = ('compact', 'polaroid')" in rules
          assert "_DEFAULT_BATTLE_STYLE = 'compact'" in main
          assert "_DEFAULT_STYLE = 'compact'" in rules

      - name: Remove helper and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temp-restore-neer-remove-classic.yml
          git add python/gui/mods/mod_00_inq_marks_config.py
          git add python/gui/mods/mod_inq_marks.py
          git add python/gui/mods/mod_inq_marks_rules.py
          git commit -m "Restore neer and remove classic from public styles"
          git push origin HEAD:${{ github.head_ref }}
